name: Flutter Engine Android ARM64 Host Artifacts

on:
  workflow_dispatch:

  push:
    branches:
      - main


permissions:
  contents: write


jobs:

  build-engine:

    strategy:
      fail-fast: false

      matrix:
        include:

          - android_cpu: arm
            artifact_cpu: arm
            mode: release

          - android_cpu: arm
            artifact_cpu: arm
            mode: profile

          - android_cpu: arm64
            artifact_cpu: arm64
            mode: release

          - android_cpu: arm64
            artifact_cpu: arm64
            mode: profile

          - android_cpu: x64
            artifact_cpu: x64
            mode: release

          - android_cpu: x64
            artifact_cpu: x64
            mode: profile


    runs-on: ubuntu-latest


    steps:


    - name: Maximize build space

      uses: easimon/maximize-build-space@v4

      with:
        root-reserve-mb: 512
        swap-size-mb: 4096
        remove-dotnet: true
        remove-haskell: true
        remove-android: true


    - name: Checkout

      uses: actions/checkout@v4


    - name: Install dependencies

      run: |

        sudo apt-get update

        sudo apt-get install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          tree \
          file \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu


    - name: Install depot_tools

      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git

        echo "$PWD/depot_tools" >> "$GITHUB_PATH"


    - name: Fetch Flutter Engine

      run: |

        mkdir flutter-engine

        cd flutter-engine

        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git

        gclient sync \
          --no-history \
          --shallow


    - name: Configure Android Engine

      run: |

        cd flutter-engine/src

        ./flutter/tools/gn \
          --target-os android \
          --android-cpu ${{ matrix.android_cpu }} \
          --linux-cpu arm64 \
          --runtime-mode ${{ matrix.mode }} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts


    - name: Determine Android output directory

      id: output

      run: |

        cd flutter-engine/src


        OUT_DIR="out/android_${{ matrix.mode }}_${{ matrix.artifact_cpu }}"


        echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_OUTPUT"


        echo "Android output directory:"
        echo "$OUT_DIR"


        test -f "$OUT_DIR/build.ninja"


    - name: Build Android Flutter JAR and ARM64 host gen_snapshot

      run: |

        cd flutter-engine/src


        OUT_DIR="${{ steps.output.outputs.OUT_DIR }}"


        ninja \
          -C "$OUT_DIR" \
          flutter.jar \
          gen_snapshot


    - name: Locate Android ARM64 host gen_snapshot

      id: snapshot

      run: |

        cd flutter-engine/src


        OUT_DIR="${{ steps.output.outputs.OUT_DIR }}"


        echo "Searching Android output for gen_snapshot..."


        find "$OUT_DIR" \
          -type f \
          -name gen_snapshot \
          -print


        SNAPSHOT=""


        while IFS= read -r FILE
        do

          if file "$FILE" | grep -q "ARM aarch64"
          then

            if file "$FILE" | grep -q "GNU/Linux"
            then

              SNAPSHOT="$FILE"

              break

            fi

          fi

        done < <(
          find "$OUT_DIR" \
            -type f \
            -name gen_snapshot
        )


        if [ -z "$SNAPSHOT" ]
        then

          echo "ERROR: Linux ARM64 gen_snapshot was not found."

          echo ""

          echo "All gen_snapshot files:"

          find "$OUT_DIR" \
            -type f \
            -name gen_snapshot \
            -exec file {} \;

          exit 1

        fi


        echo "Selected host gen_snapshot:"
        echo "$SNAPSHOT"


        echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_OUTPUT"


    - name: Verify host gen_snapshot

      run: |

        cd flutter-engine/src


        SNAPSHOT="${{ steps.snapshot.outputs.SNAPSHOT }}"


        echo "gen_snapshot:"
        echo "$SNAPSHOT"


        file "$SNAPSHOT"


        echo ""


        echo "Checking ELF..."


        if file "$SNAPSHOT" | grep -q "/system/bin/linker64"
        then

          echo "ERROR: Android gen_snapshot selected."

          exit 1

        fi


        if ! file "$SNAPSHOT" | grep -q "ARM aarch64"
        then

          echo "ERROR: gen_snapshot is not ARM64."

          exit 1

        fi


        if ! file "$SNAPSHOT" | grep -q "GNU/Linux"
        then

          echo "ERROR: gen_snapshot is not Linux."

          exit 1

        fi


    - name: Locate flutter.jar

      id: jar

      run: |

        cd flutter-engine/src


        OUT_DIR="${{ steps.output.outputs.OUT_DIR }}"


        JAR="$OUT_DIR/flutter.jar"


        if [ ! -f "$JAR" ]
        then

          echo "ERROR: flutter.jar not found:"
          echo "$JAR"


          echo ""


          echo "Searching:"


          find "$OUT_DIR" \
            -type f \
            -name flutter.jar \
            -print


          exit 1

        fi


        echo "JAR=$JAR" >> "$GITHUB_OUTPUT"


        ls -lh "$JAR"


    - name: Assemble standard Flutter artifact

      run: |

        cd flutter-engine/src


        ARTIFACT="android-${{ matrix.artifact_cpu }}-${{ matrix.mode }}"


        SNAPSHOT="${{ steps.snapshot.outputs.SNAPSHOT }}"


        JAR="${{ steps.jar.outputs.JAR }}"


        rm -rf artifact


        mkdir -p \
          "artifact/$ARTIFACT/linux-arm64"


        cp \
          "$JAR" \
          "artifact/$ARTIFACT/flutter.jar"


        cp \
          "$SNAPSHOT" \
          "artifact/$ARTIFACT/linux-arm64/gen_snapshot"


        echo ""

        echo "=============================="
        echo "Artifact tree"
        echo "=============================="


        tree artifact


    - name: Verify final artifact

      run: |

        cd flutter-engine/src


        ARTIFACT="artifact/android-${{ matrix.artifact_cpu }}-${{ matrix.mode }}"


        test -f \
          "$ARTIFACT/flutter.jar"


        test -f \
          "$ARTIFACT/linux-arm64/gen_snapshot"


        echo ""

        echo "flutter.jar:"


        ls -lh \
          "$ARTIFACT/flutter.jar"


        echo ""

        echo "gen_snapshot:"


        file \
          "$ARTIFACT/linux-arm64/gen_snapshot"


        if file \
          "$ARTIFACT/linux-arm64/gen_snapshot" \
          | grep -q "/system/bin/linker64"
        then

          echo "ERROR: gen_snapshot is Android ELF."

          exit 1

        fi


        if ! file \
          "$ARTIFACT/linux-arm64/gen_snapshot" \
          | grep -q "ARM aarch64"
        then

          echo "ERROR: gen_snapshot is not ARM64."

          exit 1

        fi


        if ! file \
          "$ARTIFACT/linux-arm64/gen_snapshot" \
          | grep -q "GNU/Linux"
        then

          echo "ERROR: gen_snapshot is not Linux."

          exit 1

        fi


        echo ""

        echo "Final artifact:"


        tree "$ARTIFACT"


    - name: Package

      run: |

        cd flutter-engine/src/artifact


        ARTIFACT="android-${{ matrix.artifact_cpu }}-${{ matrix.mode }}"


        ZIP="flutter-engine-android-${{ matrix.artifact_cpu }}-${{ matrix.mode }}.zip"


        rm -f "$ZIP"


        zip -q -r \
          "$ZIP" \
          "$ARTIFACT"


        echo ""

        echo "Package:"


        ls -lh "$ZIP"


        echo ""

        echo "Package contents:"


        unzip -l "$ZIP"


    - name: Upload build artifact

      uses: actions/upload-artifact@v4

      with:

        name: flutter-engine-android-${{ matrix.artifact_cpu }}-${{ matrix.mode }}

        path: flutter-engine/src/artifact/flutter-engine-android-${{ matrix.artifact_cpu }}-${{ matrix.mode }}.zip

        if-no-files-found: error


  release:

    name: Create GitHub Release

    needs:
      - build-engine

    runs-on: ubuntu-latest


    steps:


    - name: Download all build artifacts

      uses: actions/download-artifact@v4

      with:
        pattern: flutter-engine-android-*
        path: release-assets
        merge-multiple: true


    - name: Verify downloaded assets

      run: |

        set -e


        echo "Downloaded files:"


        find release-assets \
          -maxdepth 2 \
          -type f \
          -print


        echo ""


        COUNT=$(find release-assets \
          -maxdepth 1 \
          -type f \
          -name '*.zip' \
          | wc -l)


        echo "ZIP count: $COUNT"


        if [ "$COUNT" -ne 6 ]
        then

          echo "ERROR: Expected exactly 6 ZIP files."

          exit 1

        fi


        echo ""


        for FILE in release-assets/*.zip
        do

          echo "Checking:"
          echo "$FILE"

          unzip -t "$FILE"

          echo ""

        done


    - name: Get release date

      id: date

      run: |

        echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"


    - name: Create GitHub Release

      uses: softprops/action-gh-release@v2

      with:

        tag_name: flutter-engine-android-arm64-host-${{ steps.date.outputs.date }}

        name: Flutter Engine Android ARM64 Host ${{ steps.date.outputs.date }}

        body: |
          Flutter Engine Android artifacts with Linux ARM64 host `gen_snapshot`.

          Build matrix:

          - android-arm-release
          - android-arm-profile
          - android-arm64-release
          - android-arm64-profile
          - android-x64-release
          - android-x64-profile

          Host:

          - Linux ARM64

          Target:

          - Android ARM
          - Android ARM64
          - Android x64

          Artifact layout:

          ```text
          android-<target>-<mode>/
          ├── flutter.jar
          └── linux-arm64/
              └── gen_snapshot
          ```

        files: |
          release-assets/*.zip

        draft: false

        prerelease: false

        fail_on_unmatched_files: true
