name: Flutter Engine Daily Build ARM64

on:
  workflow_dispatch:
  schedule:
    - cron: "00 16 * * *"


permissions:
  contents: write


jobs:

# =========================================================
# Build Engine
# =========================================================

  build-engine:

    name: Build ${{ matrix.target }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:

        include:

          - target: android-arm64
            os: android
            cpu: arm64

          - target: android-x64
            os: android
            cpu: x64

          - target: linux-arm64
            os: linux
            cpu: arm64

          - target: linux-x64
            os: linux
            cpu: x64


    steps:


    - name: Maximize build space

      uses: easimon/maximize-build-space@v4

      with:

        root-reserve-mb: 512
        swap-size-mb: 8192

        remove-dotnet: true
        remove-haskell: true
        remove-android: true



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          curl \
          xz-utils \
          tree \
          file \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu



    - name: Install depot_tools

      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git

        echo "$PWD/depot_tools" >> $GITHUB_PATH



    # =====================================================
    # Flutter + Engine sync
    # =====================================================

    - name: Sync Flutter source and Engine

      run: |


        git clone \
          https://github.com/flutter/flutter.git \
          flutter


        cd flutter


        git checkout stable


        echo "Flutter revision:"
        git rev-parse HEAD


        echo "Engine revision:"
        cat bin/internal/engine.version



        gclient config \
          --name src/flutter \
          https://github.com/flutter/flutter.git



        gclient sync \
          --no-history \
          --nohooks



        cd ..



    # =====================================================
    # Build
    # =====================================================


    - name: Build Engine artifacts

      run: |


        cd flutter/src/flutter



        MODE_LIST="profile release"


        for MODE in $MODE_LIST

        do


        echo "================================"
        echo "BUILD ${{ matrix.target }} $MODE"
        echo "================================"



        OUT=out/${{ matrix.target }}-$MODE



        rm -rf "$OUT"



        if [ "${{ matrix.os }}" = "android" ];

        then


          ./flutter/tools/gn \
            --unoptimized \
            --runtime-mode $MODE \
            --target-os android \
            --android-cpu ${{ matrix.cpu }} \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts \
            --out-dir "$OUT"



        else



          ./flutter/tools/gn \
            --runtime-mode $MODE \
            --target-os linux \
            --linux-cpu ${{ matrix.cpu }} \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts \
            --out-dir "$OUT"



        fi



        ninja \
          -C "$OUT" \
          -j$(nproc)



        mkdir -p \
          ../../artifact/${{ matrix.target }}/$MODE



        if [ "${{ matrix.os }}" = "android" ];

        then


          cp \
          "$OUT/flutter.jar" \
          ../../artifact/${{ matrix.target }}/$MODE/



        fi



        if [ "${{ matrix.os }}" = "linux" ];

        then


          cp \
          "$OUT/gen_snapshot" \
          ../../artifact/${{ matrix.target }}/$MODE/


        fi



        done



    - name: Upload engine artifact


      uses: actions/upload-artifact@v4


      with:

        name: engine-${{ matrix.target }}

        path:

          flutter/artifact/

        retention-days: 1





# =========================================================
# Assemble SDK
# =========================================================


  assemble-sdk:


    name: Assemble Linux ARM64 Flutter SDK


    needs: build-engine


    runs-on: ubuntu-latest



    steps:



    - name: Download artifacts


      uses: actions/download-artifact@v4


      with:

        path: artifacts




    - name: Clone Flutter SDK


      run: |


        git clone \
          --depth=1 \
          -b stable \
          https://github.com/flutter/flutter.git \
          flutter-sdk




    - name: Inject Engine artifacts


      run: |



        ENGINE_DIR="flutter-sdk/bin/cache/artifacts/engine"


        rm -rf "$ENGINE_DIR"


        mkdir -p "$ENGINE_DIR"



        find artifacts \
          -type d \
          -name profile \
          -o \
          -name release \
          | while read d

        do


          cp -a "$d" "$ENGINE_DIR/"


        done




    - name: Install ARM64 Dart SDK


      run: |



        DART_VERSION=$(cat flutter-sdk/bin/internal/dart-sdk.version)



        wget -O dart.zip \

        https://storage.googleapis.com/dart-archive/channels/stable/release/$DART_VERSION/sdk/dartsdk-linux-arm64-release.zip



        rm -rf flutter-sdk/bin/cache/dart-sdk



        unzip -q dart.zip \
          -d flutter-sdk/bin/cache



        mv \
        flutter-sdk/bin/cache/dart-sdk-* \
        flutter-sdk/bin/cache/dart-sdk




    - name: Fix permissions


      run: |


        chmod +x flutter-sdk/bin/flutter


        chmod +x flutter-sdk/bin/cache/dart-sdk/bin/*


        find flutter-sdk \
        -name gen_snapshot \
        -exec chmod +x {} \;




    - name: Verify ARM64


      run: |


        file flutter-sdk/bin/cache/dart-sdk/bin/dart


        find flutter-sdk/bin/cache/artifacts -name gen_snapshot -exec file {} \;




    - name: Package SDK


      run: |


        tar -cJf flutter-linux-arm64.tar.xz flutter-sdk




    - name: Upload SDK


      uses: actions/upload-artifact@v4


      with:


        name: flutter-linux-arm64-sdk


        path: flutter-linux-arm64.tar.xz



    - name: Release


      env:

        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      run: |


        TAG="$(date -u +'%Y-%m-%d')-daily"



        gh release delete "$TAG" \
          --yes \
          --cleanup-tag || true



        gh release create "$TAG" \

          flutter-linux-arm64.tar.xz \

          --title "Flutter Linux ARM64 SDK $TAG" \

          --notes "Self built Flutter ARM64 SDK"
