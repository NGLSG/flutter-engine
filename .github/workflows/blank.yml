name: Flutter Engine ARM64 Artifact

on:
  workflow_dispatch:


jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
          - profile


    runs-on: ubuntu-latest


    steps:


    - name: Free space

      uses: easimon/maximize-build-space@v4

      with:
        root-reserve-mb: 512
        swap-size-mb: 4096
        remove-dotnet: true
        remove-haskell: true
        remove-android: true



    - name: Install

      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          tree



    - name: depot_tools

      run: |

        git clone --depth=1 \
        https://chromium.googlesource.com/chromium/tools/depot_tools.git

        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Sync engine

      run: |

        mkdir flutter-engine

        cd flutter-engine

        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git

        gclient sync --no-history --shallow



    #
    # Android target
    #

    - name: GN Android ARM64

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --runtime-mode ${{matrix.mode}} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts \
          --out-dir out/android



    - name: Build Android artifact

      run: |

        cd flutter-engine/src


        ninja \
        -C out/android \
        flutter.jar



    #
    # Linux ARM64 host
    #

    - name: GN Linux ARM64 host

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os linux \
          --linux-cpu arm64 \
          --runtime-mode ${{matrix.mode}} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts \
          --out-dir out/linux_host



    - name: Build host gen_snapshot

      run: |

        cd flutter-engine/src


        ninja \
        -C out/linux_host \
        gen_snapshot



    #
    # assemble
    #

    - name: Assemble artifact

      run: |

        cd flutter-engine/src


        ROOT=artifact/android-arm64-${{matrix.mode}}


        mkdir -p \
        $ROOT/linux-x64



        cp \
        $(find out/android \
        -name flutter.jar \
        | head -1) \
        $ROOT/flutter.jar



        cp \
        $(find out/linux_host \
        -name gen_snapshot \
        | head -1) \
        $ROOT/linux-x64/gen_snapshot



        tree artifact



    - name: Check

      run: |

        file \
        flutter-engine/src/artifact/android-arm64-${{matrix.mode}}/linux-x64/gen_snapshot



    - name: Package

      run: |

        cd flutter-engine/src/artifact

        zip -r \
        flutter-engine-android-arm64-${{matrix.mode}}.zip \
        android-arm64-${{matrix.mode}}



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name:
          flutter-engine-${{matrix.mode}}

        path:
          flutter-engine/src/artifact/*.zip
