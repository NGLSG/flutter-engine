name: Flutter Engine Android ARM64 Artifact

on:
  workflow_dispatch:


jobs:

  build-engine-artifact:

    strategy:
      fail-fast: false

      matrix:
        mode:
          - release
          - profile


    runs-on: ubuntu-latest


    steps:


    - name: Maximize build space

      uses: easimon/maximize-build-space@v4

      with:
        root-reserve-mb: 512
        swap-size-mb: 4096
        remove-dotnet: true
        remove-haskell: true
        remove-android: true



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          tree \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu



    - name: Install depot_tools

      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git


        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Fetch Flutter engine

      run: |

        mkdir flutter-engine

        cd flutter-engine


        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git


        gclient sync \
          --no-history \
          --shallow



    - name: Configure GN

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --linux-cpu arm64 \
          --runtime-mode ${{ matrix.mode }} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts



    - name: Locate build directory

      run: |

        cd flutter-engine/src


        find out \
          -name build.ninja



    - name: Build engine artifact targets

      run: |

        cd flutter-engine/src


        OUT_DIR=$(dirname $(find out \
          -name build.ninja \
          | head -1))


        echo "OUT_DIR=${OUT_DIR}"


        ninja \
          -C "${OUT_DIR}" \
          gen_snapshot \
          flutter.jar



    - name: Export Flutter artifact tree

      run: |

        cd flutter-engine/src


        OUT_DIR=$(dirname $(find out \
          -name build.ninja \
          | head -1))


        ARTIFACT=artifact/android-arm64-${{ matrix.mode }}


        mkdir -p \
          ${ARTIFACT}/linux-x64



        #
        # flutter.jar
        #

        cp \
        $(find "${OUT_DIR}" \
          -name flutter.jar \
          | head -1) \
        ${ARTIFACT}/flutter.jar



        #
        # gen_snapshot
        #

        cp \
        $(find "${OUT_DIR}" \
          -type f \
          -name gen_snapshot \
          | head -1) \
        ${ARTIFACT}/linux-x64/gen_snapshot



        #
        # flutter.jar license
        #

        find "${OUT_DIR}" \
          -name "license.flutter_jar_zip.md" \
          -exec cp {} ${ARTIFACT}/ \;



        #
        # gen_snapshot license
        #

        find "${OUT_DIR}" \
          -name "license.archive_linux_gen_snapshot.md" \
          -exec cp {} ${ARTIFACT}/linux-x64/ \;



        echo "Final artifact:"

        tree artifact



    - name: Verify architecture

      run: |

        file \
        flutter-engine/src/artifact/android-arm64-${{ matrix.mode }}/linux-x64/gen_snapshot



    - name: Package

      run: |

        cd flutter-engine/src/artifact


        zip -r \
        ../../flutter_engine_android_arm64_${{ matrix.mode }}.zip \
        android-arm64-${{ matrix.mode }}



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name:
          flutter-engine-android-arm64-${{ matrix.mode }}

        path:
          flutter_engine_android_arm64_${{ matrix.mode }}.zip
