name: Flutter Engine Daily Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

# 避免定时任务与手动任务同时删除/重建同一个 Release Tag。
concurrency:
  group: flutter-linux-arm64-daily-build
  cancel-in-progress: false

jobs:
  # =========================================================
  # Job 1: 为 ARM64 Linux 主机构建 Android Profile/Release 产物。
  #
  # 自 2024 年底起，Engine 源码已纳入 flutter/flutter 单仓库。
  # 不能再从已归档的 flutter/engine 仓库按 engine.version 检出。
  # =========================================================
  build-engine:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm
            cpu: arm
          - target: android-arm64
            cpu: arm64
          - target: android-x64
            cpu: x64

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v4
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: true
          remove-haskell: true
          remove-android: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ninja-build clang python3 python-is-python3 \
            zip unzip tree file xz-utils curl pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch stable Flutter source and aligned Engine dependencies
        run: |
          set -euxo pipefail

          # stable 分支中包含与 bin/internal/engine.version 对齐的 Engine 源码。
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git flutter-source
          cd flutter-source

          ENGINE_COMMIT="$(cat bin/internal/engine.version)"
          echo "Target aligned Engine version: ${ENGINE_COMMIT}"
          echo "Framework commit: $(git rev-parse HEAD)"

          # 使用仓库随附的 gclient 配置；它会在 Flutter 根目录处理 Engine 依赖。
          cp engine/scripts/standard.gclient .gclient
          gclient sync --no-history --nohooks

      - name: Build Android artifacts and Linux ARM64 snapshotter
        run: |
          set -euxo pipefail
          cd flutter-source/engine/src

          EXPORT_DIR="$GITHUB_WORKSPACE/export-${{ matrix.target }}"

          build_mode() {
            MODE="$1"
            ART_DIR="$EXPORT_DIR/${{ matrix.target }}-${MODE}"
            ANDROID_OUT="out/ci/${{ matrix.target }}-${MODE}"
            LINUX_OUT="out/ci/linux-arm64-${MODE}"

            mkdir -p "$ART_DIR/linux-arm64"

            # 生成与目标 Android ABI / runtime mode 匹配的 flutter.jar。
            ./flutter/tools/gn \
              --target-dir "ci/${{ matrix.target }}-${MODE}" \
              --target-os android \
              --android-cpu "${{ matrix.cpu }}" \
              --runtime-mode "$MODE" \
              --no-goma \
              --no-enable-unittests \
              --build-engine-artifacts
            ninja -C "$ANDROID_OUT" flutter/shell/platform/android:embedding_jars -j"$(nproc)"

            FLUTTER_JAR="$(find "$ANDROID_OUT" -type f -name flutter.jar -print -quit)"
            test -n "$FLUTTER_JAR"
            cp "$FLUTTER_JAR" "$ART_DIR/flutter.jar"

            # Flutter 工具在 Linux ARM64 主机上从 <android-engine>/linux-arm64/
            # 加载 gen_snapshot。此处用稳定分支所带的 Engine 源码构建该可执行文件。
            ./flutter/tools/gn \
              --target-dir "ci/linux-arm64-${MODE}" \
              --target-os linux \
              --linux-cpu arm64 \
              --runtime-mode "$MODE" \
              --no-goma \
              --no-enable-unittests \
              --build-engine-artifacts
            ninja -C "$LINUX_OUT" gen_snapshot -j"$(nproc)"

            cp "$LINUX_OUT/gen_snapshot" "$ART_DIR/linux-arm64/gen_snapshot"
            chmod +x "$ART_DIR/linux-arm64/gen_snapshot"

            test -s "$ART_DIR/flutter.jar"
            test -x "$ART_DIR/linux-arm64/gen_snapshot"
            file "$ART_DIR/linux-arm64/gen_snapshot" | grep -Eq 'ARM aarch64|aarch64'
          }

          build_mode profile
          build_mode release

      - name: Upload single target artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifact-${{ matrix.target }}
          path: export-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1

  # =========================================================
  # Job 2: 组装 Flutter stable SDK，并创建/更新当天的 Release。
  # =========================================================
  assemble-and-package:
    name: Assemble SDK & Create Release
    needs: build-engine
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tree file xz-utils curl unzip

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: fetched-artifacts

      - name: Clone clean stable Flutter SDK
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git flutter-sdk
          echo "Packaged Engine version: $(cat flutter-sdk/bin/internal/engine.version)"

      - name: Assemble built artifacts and ARM64 Dart SDK
        run: |
          set -euxo pipefail

          ENGINE_CACHE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          rm -rf "$ENGINE_CACHE_DIR"
          mkdir -p "$ENGINE_CACHE_DIR"

          # artifacts 会按 <artifact-name>/<engine-directory> 解压。
          while IFS= read -r -d '' dir; do
            dirname="$(basename "$dir")"
            echo "Injecting engine artifact: $dirname"
            cp -a "$dir" "$ENGINE_CACHE_DIR/"
          done < <(find fetched-artifacts -mindepth 2 -maxdepth 2 -type d -name 'android-*' -print0)

          # 防止因上传目录布局异常而生成一个缺少产物的 SDK。
          for target in android-arm android-arm64 android-x64; do
            for mode in profile release; do
              test -s "$ENGINE_CACHE_DIR/${target}-${mode}/flutter.jar"
              test -x "$ENGINE_CACHE_DIR/${target}-${mode}/linux-arm64/gen_snapshot"
            done
          done

          ENGINE_COMMIT="$(cat flutter-sdk/bin/internal/engine.version)"
          DART_SDK_URL="https://storage.googleapis.com/flutter_infra_release/flutter/${ENGINE_COMMIT}/dart-sdk-linux-arm64.zip"
          echo "Fetching Linux ARM64 Dart SDK: $DART_SDK_URL"

          curl --fail --location --retry 3 --retry-all-errors \
            "$DART_SDK_URL" -o dart-sdk-arm64.zip
          unzip -tq dart-sdk-arm64.zip
          rm -rf flutter-sdk/bin/cache/dart-sdk
          unzip -q dart-sdk-arm64.zip -d flutter-sdk/bin/cache/
          rm -f dart-sdk-arm64.zip

          # 阻止 flutter 工具用上游 x64 引擎产物覆盖已注入的 ARM64 产物。
          echo "$ENGINE_COMMIT" > flutter-sdk/bin/cache/engine.stamp

          chmod +x flutter-sdk/bin/flutter
          chmod +x flutter-sdk/bin/cache/dart-sdk/bin/*
          find "$ENGINE_CACHE_DIR" -type f -name gen_snapshot -exec chmod +x {} \;

      - name: Verify ARM64 executables and artifact layout
        run: |
          set -euxo pipefail

          DART_BIN="flutter-sdk/bin/cache/dart-sdk/bin/dart"
          file "$DART_BIN" | grep -Eq 'ARM aarch64|aarch64'

          for target in android-arm android-arm64 android-x64; do
            for mode in profile release; do
              GEN_SNAPSHOT="flutter-sdk/bin/cache/artifacts/engine/${target}-${mode}/linux-arm64/gen_snapshot"
              file "$GEN_SNAPSHOT" | grep -Eq 'ARM aarch64|aarch64'
            done
          done

      - name: Compress SDK package
        run: |
          set -euxo pipefail
          tar -cJf flutter-linux-arm64.tar.xz flutter-sdk
          ls -lh flutter-linux-arm64.tar.xz

      - name: Buffer final package as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-arm64-full-sdk
          path: flutter-linux-arm64.tar.xz
          if-no-files-found: error
          retention-days: 7

      - name: Generate release tag
        id: date
        run: |
          DATE="$(date -u +'%Y-%m-%d')"
          TAG="${DATE}-daily-build"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ steps.date.outputs.tag }}"
          DATE="${{ steps.date.outputs.date }}"

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            flutter-linux-arm64.tar.xz \
            --title "Flutter SDK (Linux ARM64 Out-of-the-Box) - $DATE" \
            --notes "Flutter stable SDK with Linux ARM64 Dart and Android AOT build artifacts for Linux ARM64 hosts." \
            --latest
