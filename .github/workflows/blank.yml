# Flutter SDK (Linux ARM64) Weekly Build — with Android AOT gen_snapshot
#
# WHY THIS EXISTS / ROOT CAUSE
# ---------------------------------------------------------------------------
# Google ships the Android AOT compiler `gen_snapshot` ONLY for x64/mac/win
# hosts, never for a linux-arm64 host. On an arm64 Linux host (Termux proot,
# Chromebook, Graviton, etc.) `flutter build apk --release/--profile` runs the
# AOT step and execs, per target ABI:
#     bin/cache/artifacts/engine/android-<abi>-<mode>/linux-arm64/gen_snapshot
# which does not exist -> "Failed to find ... gen_snapshot in the search path".
#
# EVIDENCE
#   * android-arm64-release/linux-arm64.zip  -> HTTP 404 on the Flutter CDN
#     android-arm64-release/linux-x64.zip    -> HTTP 200  (x64 host only)
#     dart-sdk-linux-arm64.zip               -> HTTP 200  (arm64 dart IS shipped)
#     linux-arm64/artifacts.zip (host engine)-> HTTP 200  (arm64 host IS shipped)
#   * flutter/flutter PR #182552 "Ship gen_snapshot for linux-arm64 hosts
#     targeting Android": 8 configs = {arm,arm64,x64,riscv64} x {profile,release};
#     `ninja clang_arm64/gen_snapshot` -> "ELF 64-bit ... ARM aarch64 ... glibc";
#     download_android_deps:false honored (no NDK needed for gen_snapshot).
#   * Issues #168980 #85434 #177936 #189724, SO 76025990 (Termux proot):
#     the SAME error, and a generic `--target-os linux` arm64 gen_snapshot does
#     NOT work for Android ("not the Android AOT snapshot generator, VM flag
#     errors"). EACH Android ABI needs its OWN gen_snapshot, profile AND release.
#   * DEPS ships buildtools/linux-arm64/clang -> native arm64 build compiles.
#
# WHAT THE OLD WORKFLOW GOT WRONG
#   1. Ran on ubuntu-latest (x64) -> any gen_snapshot produced was x64-host.
#   2. For the android matrix it built only flutter.jar, never gen_snapshot.
#   3. It built ONE `--target-os linux --linux-cpu arm64` gen_snapshot, which
#      targets the Linux DESKTOP runtime and is useless for Android APKs.
#   => android-<abi>-<mode>/linux-arm64/gen_snapshot was never produced.
#
# THE FIX
#   * Build on a NATIVE arm64 runner (ubuntu-24.04-arm, free for public repos).
#   * For each Android ABI {arm,arm64,x64} x {profile,release} run
#       gn --android --android-cpu <abi> --runtime-mode <mode>
#       ninja gen_snapshot        (arm64-HOST binary that emits <abi> AOT code)
#     and place it at android-<abi>-<mode>/linux-arm64/gen_snapshot.
#   * Assemble a stock stable SDK on arm64: `flutter precache` pulls
#     dart-sdk-linux-arm64, common patched SDK, host engine tools, and the
#     official Android flutter.jar artifacts for arm/arm64/x64 in all modes.
#     Then inject the six source-built arm64 gen_snapshots.
#   * Package the populated cache together with the pinned Flutter checkout as
#     one Linux ARM64 offline SDK archive. The workflow does not build an app;
#     its only deliverable is the ready-to-extract SDK.

name: Flutter SDK (Linux ARM64) Weekly Build

on:
  workflow_dispatch:
  schedule:
    - cron: "00 16 * * 1"

permissions:
  contents: write

jobs:

  # =========================================================
  # Pin one stable commit so every job builds/ships the same
  # engine revision (gen_snapshot MUST match the SDK's Dart
  # version or you get "Can't load Kernel binary: Invalid SDK hash").
  # =========================================================
  resolve:
    name: Resolve stable revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      engine: ${{ steps.r.outputs.engine }}
    steps:
      - id: r
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/flutter/flutter.git refs/heads/stable | cut -f1)
          engine=$(curl -fsSL "https://raw.githubusercontent.com/flutter/flutter/${sha}/bin/internal/engine.version")
          echo "sha=$sha"       >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "stable flutter = $sha"
          echo "engine.version = $engine"

  # =========================================================
  # Build the missing piece: Android gen_snapshot as an
  # arm64-HOST binary, one per ABI, profile + release.
  # =========================================================
  build-gen-snapshot:
    name: gen_snapshot android-${{ matrix.cpu }}
    needs: resolve
    runs-on: ubuntu-24.04-arm        # native arm64 => aarch64 host binary
    strategy:
      fail-fast: false
      matrix:
        cpu: [arm, arm64, x64]       # 32-bit ARM, 64-bit ARM, x86_64 Android

    steps:

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip xz-utils file tree \
            python3 python-is-python3 \
            build-essential pkg-config

      - name: Install depot_tools
        run: |
          set -euo pipefail
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Checkout Flutter (pinned) + gclient sync
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          git clone https://github.com/flutter/flutter.git flutter
          cd flutter
          git checkout "${{ needs.resolve.outputs.sha }}"
          echo "Flutter: $(git rev-parse HEAD)"
          echo "Engine : $(cat bin/internal/engine.version)"
          # standard.gclient uses solution name "." ; on an arm64 host
          # download_android_deps defaults to false, so no NDK/SDK is fetched.
          cp engine/scripts/standard.gclient .gclient
          gclient sync --no-history -D
          test -f engine/src/flutter/tools/gn

      - name: Build gen_snapshot (profile + release)
        run: |
          set -euo pipefail
          cd flutter/engine/src
          CPU="${{ matrix.cpu }}"
          OUTDIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUTDIR"

          for MODE in profile release; do
            echo "===================================================="
            echo " gen_snapshot  android-${CPU}  ${MODE}  (host=linux-arm64)"
            echo "===================================================="
            rm -rf out
            python3 flutter/tools/gn \
              --android \
              --android-cpu "$CPU" \
              --runtime-mode "$MODE" \
              --no-goma \
              --no-enable-unittests \
              --build-engine-artifacts

            OUT=$(find out -name build.ninja -printf '%h\n' -quit)
            echo "out dir: $OUT"

            # On an arm64 host the host toolchain lives in clang_arm64/.
            # Prefer that label; fall back to the plain target name.
            ninja -C "$OUT" clang_arm64/gen_snapshot -j"$(nproc)" \
              || ninja -C "$OUT" gen_snapshot -j"$(nproc)"

            GEN=$(find "$OUT" -type f -name gen_snapshot -path "*clang_arm64*" -print -quit)
            [ -z "$GEN" ] && GEN=$(find "$OUT" -type f -name gen_snapshot -print -quit)
            echo "found: $GEN"
            file "$GEN"
            # Guard: it MUST be an aarch64 host binary, not x64 / not android.
            file "$GEN" | grep -q "ARM aarch64" \
              || { echo "FATAL: gen_snapshot is not an arm64 host binary"; exit 1; }

            DEST="$OUTDIR/android-${CPU}-${MODE}/linux-arm64"
            mkdir -p "$DEST"
            cp "$GEN" "$DEST/gen_snapshot"
            chmod +x "$DEST/gen_snapshot"
          done

          echo "========== produced =========="
          tree "$OUTDIR"

      - name: Upload gen_snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gensnapshot-${{ matrix.cpu }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  # =========================================================
  # Assemble a ready-to-use Linux ARM64 Flutter SDK.
  # =========================================================
  assemble-sdk:
    name: Assemble SDK
    needs: [resolve, build-gen-snapshot]
    runs-on: ubuntu-24.04-arm        # arm64 so dart-sdk/host engine bootstrap arm64
    steps:

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl unzip xz-utils file tree

      - name: Download gen_snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: gensnapshot-*
          path: gensnapshots
          merge-multiple: true

      - name: Show source-built gen_snapshots
        run: tree gensnapshots

      - name: Checkout Flutter SDK (pinned)
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git flutter-sdk
          cd flutter-sdk
          git checkout "${{ needs.resolve.outputs.sha }}"
          echo "SDK Flutter: $(git rev-parse HEAD)"

      - name: Bootstrap ARM64 SDK
        run: |
          set -euo pipefail
          export PATH="$PWD/flutter-sdk/bin:$PATH"
          # Bootstrap Dart/flutter_tools, then populate common patched SDK
          # files and all Linux ARM64 host-side engine tools.
          flutter --version
          flutter precache --universal

      - name: Pull official Android flutter.jar artifacts
        run: |
          set -euo pipefail
          ENGINE="${{ needs.resolve.outputs.engine }}"
          ENGINE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          CACHE_DIR="flutter-sdk/bin/cache"
          STORAGE_BASE_URL="${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}"
          BASE_URL="${STORAGE_BASE_URL}/flutter_infra_release/flutter/${ENGINE}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          # On the actual linux-arm64 run, `flutter precache` completed after
          # the universal set and did not populate these Android directories.
          # Pull the target-side engine archives explicitly, without relying
          # on host artifact selection or an existing cache stamp.
          for DIR in \
            android-x86 \
            android-arm android-arm-profile android-arm-release \
            android-arm64 android-arm64-profile android-arm64-release \
            android-x64 android-x64-profile android-x64-release; do
            echo "Downloading ${DIR}/artifacts.zip"
            ARCHIVE="$TMP/${DIR}-artifacts.zip"
            DEST="$ENGINE_DIR/$DIR"
            curl --fail --location --retry 5 --retry-all-errors \
              "$BASE_URL/$DIR/artifacts.zip" \
              --output "$ARCHIVE"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            unzip -q "$ARCHIVE" -d "$DEST"
            test -s "$DEST/flutter.jar" \
              || { echo "FATAL: $DEST/flutter.jar missing"; exit 1; }
            unzip -tqq "$DEST/flutter.jar"
          done

          # Current stable's cache validator still requires these six
          # official linux-x64 directories even on a linux-arm64 host.
          # They are retained only to keep the cache fully offline/up-to-date;
          # the ARM64 host executes the linux-arm64 binaries injected below.
          for DIR in \
            android-arm-profile android-arm-release \
            android-arm64-profile android-arm64-release \
            android-x64-profile android-x64-release; do
            echo "Downloading ${DIR}/linux-x64.zip"
            ARCHIVE="$TMP/${DIR}-linux-x64.zip"
            DEST="$ENGINE_DIR/$DIR/linux-x64"
            curl --fail --location --retry 5 --retry-all-errors \
              "$BASE_URL/$DIR/linux-x64.zip" \
              --output "$ARCHIVE"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            unzip -q "$ARCHIVE" -d "$DEST"
            test -s "$DEST/gen_snapshot" \
              || { echo "FATAL: $DEST/gen_snapshot missing"; exit 1; }
            chmod +x "$DEST/gen_snapshot"
          done

          # Match EngineCachedArtifact's two stamp names so later offline
          # commands do not attempt to redownload these complete directories.
          printf '%s' "$ENGINE" > "$CACHE_DIR/android-internal-build-artifacts.stamp"
          printf '%s' "$ENGINE" > "$CACHE_DIR/android-sdk.stamp"

      - name: Inject arm64 Android gen_snapshots
        run: |
          set -euo pipefail
          ENGINE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          # Add android-<abi>-<mode>/linux-arm64/gen_snapshot beside the
          # official target-side flutter.jar and linux-x64 host artifacts.
          cp -a gensnapshots/. "$ENGINE_DIR"/
          find "$ENGINE_DIR" -type f -name gen_snapshot -path "*linux-arm64*" \
            -exec chmod +x {} \;
          echo "========== engine cache =========="
          tree "$ENGINE_DIR" | sed -n '1,120p'

      - name: Verify SDK
        run: |
          set -euo pipefail
          ENGINE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          echo "--- dart (must be ARM aarch64) ---"
          DART="flutter-sdk/bin/cache/dart-sdk/bin/dart"
          test -x "$DART"
          file "$DART" | tee /dev/stderr | grep -q "ARM aarch64"

          echo "--- complete ARM64 host toolchain ---"
          for f in flutter_tester impellerc; do
            p="$ENGINE_DIR/linux-arm64/$f"
            test -x "$p" \
              || { echo "FATAL: ARM64 host tool missing: $p"; exit 1; }
            file "$p" | tee /dev/stderr | grep -q "ARM aarch64"
          done
          HOST_GEN="$ENGINE_DIR/linux-arm64/gen_snapshot"
          test -x "$HOST_GEN" \
            || { echo "FATAL: host gen_snapshot missing: $HOST_GEN"; exit 1; }
          file "$HOST_GEN" | grep -q "ARM aarch64" \
            || { echo "FATAL: host gen_snapshot has wrong architecture"; exit 1; }
          test -f "$ENGINE_DIR/linux-arm64/frontend_server_aot.dart.snapshot" \
            || { echo "FATAL: frontend_server snapshot missing"; exit 1; }
          test -d "$ENGINE_DIR/linux-arm64/shader_lib" \
            || { echo "FATAL: shader_lib missing"; exit 1; }
          test -f "$ENGINE_DIR/common/flutter_patched_sdk/platform_strong.dill" \
            || { echo "FATAL: flutter_patched_sdk missing"; exit 1; }
          test -f "$ENGINE_DIR/common/flutter_patched_sdk_product/platform_strong.dill" \
            || { echo "FATAL: flutter_patched_sdk_product missing"; exit 1; }

          echo "--- complete Android engine cache ---"
          for dir in \
            android-arm android-arm-profile android-arm-release \
            android-arm64 android-arm64-profile android-arm64-release \
            android-x64 android-x64-profile android-x64-release; do
            test -s "$ENGINE_DIR/$dir/flutter.jar" \
              || { echo "FATAL: $ENGINE_DIR/$dir/flutter.jar missing"; exit 1; }
            unzip -tqq "$ENGINE_DIR/$dir/flutter.jar"
            sha256sum "$ENGINE_DIR/$dir/flutter.jar"
          done
          test -s "flutter-sdk/bin/cache/android-internal-build-artifacts.stamp"
          test -s "flutter-sdk/bin/cache/android-sdk.stamp"

          echo "--- android gen_snapshots (must all be ARM aarch64) ---"
          COUNT=0
          for CPU in arm arm64 x64; do
            for MODE in profile release; do
              GEN="$ENGINE_DIR/android-${CPU}-${MODE}/linux-arm64/gen_snapshot"
              test -x "$GEN" \
                || { echo "FATAL: $GEN missing"; exit 1; }
              file "$GEN"
              file "$GEN" | grep -q "ARM aarch64" \
                || { echo "FATAL: $GEN has wrong architecture"; exit 1; }
              COUNT=$((COUNT + 1))
            done
          done
          [ "$COUNT" -eq 6 ] \
            || { echo "FATAL: expected 6 Android gen_snapshots, got $COUNT"; exit 1; }
          echo "verified $COUNT Android ARM64-host gen_snapshot binaries"

          # Final SDK command is run before packaging, after all injection.
          flutter-sdk/bin/flutter --version

      - name: Package SDK
        run: |
          set -euo pipefail
          cat > flutter-sdk/OFFLINE-SDK-MANIFEST.txt <<EOF
          Flutter Linux ARM64 offline SDK
          Flutter commit: ${{ needs.resolve.outputs.sha }}
          Engine commit:  ${{ needs.resolve.outputs.engine }}
          Host:           linux-arm64
          Android Engine: official arm, arm64, x64 flutter.jar (debug/profile/release)
          Android AOT:    arm, arm64, x64 (profile + release)
          EOF
          tar -cJf flutter-linux-arm64-offline-sdk.tar.xz flutter-sdk
          ls -lh flutter-linux-arm64-offline-sdk.tar.xz

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-arm64-offline-sdk
          path: flutter-linux-arm64-offline-sdk.tar.xz
          if-no-files-found: error
          retention-days: 7

  # =========================================================
  # Publish the Linux ARM64 offline Flutter SDK
  # =========================================================
  release:
    name: Create GitHub Release
    needs: assemble-sdk
    runs-on: ubuntu-latest
    steps:

      - name: Download SDK Artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-linux-arm64-offline-sdk

      - name: Verify Package
        run: |
          set -euo pipefail
          ls -lh
          test -f flutter-linux-arm64-offline-sdk.tar.xz

      - name: Generate Release Tag
        id: date
        run: |
          set -euo pipefail
          DATE="$(date -u +'%Y-%m-%d')"
          echo "date=$DATE"                 >> "$GITHUB_OUTPUT"
          echo "tag=${DATE}-weekly-build"   >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.date.outputs.tag }}"
          DATE="${{ steps.date.outputs.date }}"
          gh release delete "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag || true
          gh release create "$TAG" \
            flutter-linux-arm64-offline-sdk.tar.xz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flutter Offline SDK (Linux ARM64) - $DATE" \
            --notes "Complete pre-cached Flutter SDK for Linux ARM64. Includes official Android arm/arm64/x64 flutter.jar artifacts for debug/profile/release and source-built ARM64-host gen_snapshot binaries for profile/release." \
            --latest
