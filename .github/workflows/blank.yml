name: Flutter Engine Daily Build (Mono-Repo)

on:
  workflow_dispatch:
  schedule:
    - cron: "00 16 * * *"

permissions:
  contents: write

jobs:
  # =========================================================
  # Job 1: 基于 Mono-Repo 矩阵编译 Engine 碎片
  # =========================================================
  build-engine:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm
            os: android
            cpu: arm
          - target: android-arm64
            os: android
            cpu: arm64
          - target: android-x64
            os: android
            cpu: x64
          - target: linux-arm64
            os: linux
            cpu: arm64
          - target: linux-x64
            os: linux
            cpu: x64

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v4
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: true
          remove-haskell: true
          remove-android: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ninja-build clang python3 python-is-python3 \
            zip unzip tree file xz-utils curl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # 1. 安装 depot_tools 并配置 PATH
      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      # 2. 克隆 Mono-repo 并正确初始化 gclient
      - name: Checkout Flutter Mono-repo & Init gclient
        run: |
          git clone -b stable https://github.com/flutter/flutter.git flutter-mono
          
          # 在根目录配置 gclient
          gclient config --name=src/flutter https://github.com/flutter/flutter.git
          
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          gclient sync --nohooks --no-history

      # 3. 动态寻找 GN 路径并编译 Engine 碎片
      - name: Build Engine Artifacts
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"

          # 自动精确定位包含 gn 脚本的目录
          GN_PATH=$(find . -path "*/tools/gn" | head -n 1)
          if [ -z "$GN_PATH" ]; then
            echo "ERROR: Could not find tools/gn script!"
            exit 1
          fi

          # 进入 tools/ 所在父目录 (即 flutter/ 源码根目录)
          ENGINE_SRC_DIR=$(dirname $(dirname "$GN_PATH"))
          cd "$ENGINE_SRC_DIR/.."
          
          echo "Engine Root Directory: $PWD"
          EXPORT_DIR="$PWD/export-${{ matrix.target }}"

          build_mode() {
            MODE=$1
            echo "=========================================="
            echo "Building ${{ matrix.target }} - $MODE"
            echo "=========================================="

            ART_DIR="$EXPORT_DIR/${{ matrix.target }}-${MODE}"
            mkdir -p "$ART_DIR/linux-arm64"

            # A. Android 目标 -> 编 flutter.jar
            if [ "${{ matrix.os }}" = "android" ]; then
              rm -rf out
              ./flutter/tools/gn \
                --target-os android \
                --android-cpu ${{ matrix.cpu }} \
                --runtime-mode $MODE \
                --no-goma \
                --no-enable-unittests \
                --build-engine-artifacts

              OUT_ANDROID=$(find out -name build.ninja -printf '%h\n' | tail -1)
              ninja -C "$OUT_ANDROID" flutter.jar -j20

              cp "$OUT_ANDROID/flutter.jar" "$ART_DIR/flutter.jar"
            fi

            # B. Linux ARM64 宿主 -> 编 gen_snapshot
            rm -rf out
            ./flutter/tools/gn \
              --target-os linux \
              --linux-cpu arm64 \
              --runtime-mode $MODE \
              --no-goma \
              --no-enable-unittests \
              --build-engine-artifacts

            OUT_LINUX=$(find out -name build.ninja -printf '%h\n' | tail -1)
            ninja -C "$OUT_LINUX" gen_snapshot -j20

            cp "$OUT_LINUX/gen_snapshot" "$ART_DIR/linux-arm64/gen_snapshot"
            chmod +x "$ART_DIR/linux-arm64/gen_snapshot"
          }

          build_mode profile
          build_mode release

      - name: Upload Single Target Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifact-${{ matrix.target }}
          path: export-${{ matrix.target }}/
          retention-days: 1

  # =========================================================
  # Job 2: 组装 Ready-to-use SDK 并发布 Release
  # =========================================================
  assemble-and-package:
    name: Assemble SDK & Create Release
    needs: build-engine
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tree file xz-utils curl unzip

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: fetched-artifacts

      - name: Clone Clean Flutter SDK
        run: |
          git clone -b stable https://github.com/flutter/flutter.git flutter-sdk

      - name: Assemble All Built Artifacts & Fix Permissions
        run: |
          ENGINE_CACHE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          rm -rf "$ENGINE_CACHE_DIR"
          mkdir -p "$ENGINE_CACHE_DIR"

          # 1. 注入自编译 Engine 碎片
          find fetched-artifacts -mindepth 2 -maxdepth 2 -type d | while read dir; do
            dirname=$(basename "$dir")
            echo "Injecting engine artifact: $dirname"
            cp -a "$dir" "$ENGINE_CACHE_DIR/"
          done

          ENGINE_COMMIT=$(cat flutter-sdk/bin/internal/engine.version)

          # 2. 拉取匹配 Commit 的 Native Linux ARM64 Dart SDK
          DART_SDK_URL="https://storage.googleapis.com/flutter_infra_release/flutter/${ENGINE_COMMIT}/dart-sdk-linux-arm64.zip"
          echo "Fetching Native Linux ARM64 Dart SDK from: $DART_SDK_URL"

          curl -sSL "$DART_SDK_URL" -o dart-sdk-arm64.zip
          rm -rf flutter-sdk/bin/cache/dart-sdk
          unzip -q dart-sdk-arm64.zip -d flutter-sdk/bin/cache/
          rm dart-sdk-arm64.zip

          # 3. 写入 engine.stamp 锁定标记
          echo "$ENGINE_COMMIT" > flutter-sdk/bin/cache/engine.stamp

          # 4. 统一递归赋予可执行权限 (+x)
          echo "Granting execution permissions (+x)..."
          chmod +x flutter-sdk/bin/flutter
          chmod +x flutter-sdk/bin/cache/dart-sdk/bin/*
          find flutter-sdk/bin/cache/artifacts/engine -name gen_snapshot -exec chmod +x {} \;

      - name: Verify Architecture & Permissions
        run: |
          DART_BIN="flutter-sdk/bin/cache/dart-sdk/bin/dart"
          GEN_SNAPSHOT="flutter-sdk/bin/cache/artifacts/engine/android-arm64-release/linux-arm64/gen_snapshot"

          file "$DART_BIN" | grep "ARM aarch64" || (echo "ERROR: Dart Binary is NOT Linux ARM64!" && exit 1)
          file "$GEN_SNAPSHOT" | grep "ARM aarch64" || (echo "ERROR: gen_snapshot is NOT Linux ARM64!" && exit 1)

      - name: Compress SDK Package
        run: |
          tar -cJf flutter-linux-arm64.tar.xz flutter-sdk
          ls -lh flutter-linux-arm64.tar.xz

      - name: Buffer Final Package to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-arm64-full-sdk
          path: flutter-linux-arm64.tar.xz
          retention-days: 7

      - name: Generate Release Tag
        id: date
        run: |
          DATE="$(date -u +'%Y-%m-%d')"
          TAG="${DATE}-daily-build"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.date.outputs.tag }}"
          DATE="${{ steps.date.outputs.date }}"

          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" \
            flutter-linux-arm64.tar.xz \
            --title "Flutter SDK (Linux ARM64 Out-of-the-Box) - $DATE" \
            --notes "Out-of-the-box ready-to-use Flutter SDK for Linux ARM64 host devices (Full Mono-repo build)." \
            --latest
