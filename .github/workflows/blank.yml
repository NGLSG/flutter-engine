name: Flutter Engine Daily Build ARM64


on:
  workflow_dispatch:

  schedule:
    - cron: "00 16 * * *"


permissions:
  contents: write



jobs:



# ============================================================
# Build Engine
# ============================================================


  build-engine:


    name: Build ${{ matrix.target }}


    runs-on: ubuntu-latest



    strategy:

      fail-fast: false

      matrix:

        include:

          - target: android-arm64
            os: android
            cpu: arm64

          - target: android-x64
            os: android
            cpu: x64

          - target: linux-arm64
            os: linux
            cpu: arm64



    steps:



    - name: Maximize disk


      uses: easimon/maximize-build-space@v4


      with:

        root-reserve-mb: 512
        swap-size-mb: 8192

        remove-dotnet: true
        remove-haskell: true
        remove-android: true




    - name: Install dependencies


      run: |


        sudo apt update


        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          curl \
          xz-utils \
          tree \
          file \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu





    - name: Install depot_tools


      run: |


        git clone --depth=1 \
        https://chromium.googlesource.com/chromium/tools/depot_tools.git



        echo "$PWD/depot_tools" >> $GITHUB_PATH






# ============================================================
# Sync Flutter + Engine
# ============================================================


    - name: Sync Flutter Engine


      run: |


        git clone \
        https://github.com/flutter/flutter.git \
        flutter



        cd flutter



        git checkout stable



        echo "Flutter:"
        git rev-parse HEAD



        echo "Engine revision:"
        cat bin/internal/engine.version




        export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH



        gclient config \
        https://github.com/flutter/flutter.git




        gclient sync \
        --no-history



        echo "Engine tree:"


        ls src/flutter



        test -f src/flutter/tools/gn




# ============================================================
# Build
# ============================================================


    - name: Build Engine


      run: |


        cd flutter/src/flutter



        build_android()
        {


          CPU=$1

          MODE=$2



          echo "==============================="
          echo "Android $CPU $MODE"
          echo "==============================="




          rm -rf out



          ./tools/gn \
            --runtime-mode $MODE \
            --target-os android \
            --android-cpu $CPU \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts





          OUT=$(find out -name build.ninja -printf "%h\n" | head -1)



          ninja \
            -C "$OUT" \
            flutter.jar \
            -j$(nproc)



          mkdir -p \
          ../../artifacts/android-$CPU-$MODE



          cp \
          "$OUT/flutter.jar" \
          ../../artifacts/android-$CPU-$MODE/




        }





        build_linux()
        {



          MODE=$1



          echo "==============================="
          echo "Linux ARM64 $MODE"
          echo "==============================="



          rm -rf out



          ./tools/gn \
            --runtime-mode $MODE \
            --target-os linux \
            --linux-cpu arm64 \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts




          OUT=$(find out -name build.ninja -printf "%h\n" | head -1)



          ninja \
          -C "$OUT" \
          gen_snapshot \
          -j$(nproc)



          mkdir -p \
          ../../artifacts/linux-arm64-$MODE



          cp \
          "$OUT/gen_snapshot" \
          ../../artifacts/linux-arm64-$MODE/



          chmod +x \
          ../../artifacts/linux-arm64-$MODE/gen_snapshot



        }




        if [ "${{matrix.os}}" = "android" ]
        then


          build_android ${{matrix.cpu}} profile

          build_android ${{matrix.cpu}} release


        else


          build_linux profile

          build_linux release


        fi





    - name: Upload Engine Artifact


      uses: actions/upload-artifact@v4


      with:

        name: engine-${{matrix.target}}

        path:

          flutter/artifacts/





# ============================================================
# Assemble SDK
# ============================================================



  assemble-sdk:



    needs: build-engine


    runs-on: ubuntu-latest



    steps:



    - name: Download artifacts


      uses: actions/download-artifact@v4


      with:

        path: artifacts





    - name: Clone Flutter SDK


      run: |


        git clone \
        --depth 1 \
        -b stable \
        https://github.com/flutter/flutter.git \
        flutter-sdk





    - name: Inject Engine


      run: |


        ENGINE_DIR="flutter-sdk/bin/cache/artifacts/engine"



        rm -rf "$ENGINE_DIR"



        mkdir -p "$ENGINE_DIR"



        find artifacts \
        -type f \
        | while read f

        do

          cp "$f" "$ENGINE_DIR/"

        done





    - name: Install ARM64 Dart SDK


      run: |


        ENGINE=$(cat flutter-sdk/bin/internal/engine.version)



        echo $ENGINE




        curl -L \
        https://storage.googleapis.com/flutter_infra_release/flutter/${ENGINE}/dart-sdk-linux-arm64.zip \
        -o dart.zip




        rm -rf flutter-sdk/bin/cache/dart-sdk



        unzip -q dart.zip \
        -d flutter-sdk/bin/cache



        mv \
        flutter-sdk/bin/cache/dart-sdk-* \
        flutter-sdk/bin/cache/dart-sdk





    - name: Permission fix


      run: |


        chmod +x flutter-sdk/bin/flutter


        chmod +x flutter-sdk/bin/cache/dart-sdk/bin/*



        find flutter-sdk \
        -name gen_snapshot \
        -exec chmod +x {} \;





    - name: Verify


      run: |


        file flutter-sdk/bin/cache/dart-sdk/bin/dart



        find flutter-sdk/bin/cache \
        -name gen_snapshot \
        -exec file {} \;






    - name: Package


      run: |


        tar -cJf flutter-linux-arm64.tar.xz flutter-sdk




    - name: Upload


      uses: actions/upload-artifact@v4


      with:

        name: flutter-linux-arm64-sdk

        path: flutter-linux-arm64.tar.xz





    - name: Release


      env:

        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}


      run: |


        TAG="$(date -u +'%Y-%m-%d')-daily"



        gh release delete "$TAG" \
        --yes \
        --cleanup-tag || true



        gh release create "$TAG" \
        flutter-linux-arm64.tar.xz \
        --title "Flutter Linux ARM64 SDK $TAG" \
        --notes "Daily Flutter ARM64 build"
