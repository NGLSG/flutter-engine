name: Flutter Engine Android ARM64 Artifact

on:
  workflow_dispatch:


jobs:

  build-engine-artifact:


    strategy:

      fail-fast: false

      matrix:

        mode:
          - release
          - profile


    runs-on: ubuntu-latest


    steps:


    - name: Maximize build space

      uses: easimon/maximize-build-space@v4

      with:

        root-reserve-mb: 512

        swap-size-mb: 4096

        remove-dotnet: true

        remove-haskell: true

        remove-android: true



    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          tree \
          file \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu



    - name: Install depot_tools

      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git


        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Fetch Flutter Engine

      run: |

        mkdir flutter-engine


        cd flutter-engine


        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git


        gclient sync \
          --no-history \
          --shallow




    ##################################################
    #
    # Android ARM64 target
    #
    ##################################################


    - name: Configure Android ARM64


      run: |


        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --runtime-mode ${{ matrix.mode }} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts



    - name: Build Android flutter.jar


      run: |


        cd flutter-engine/src


        ninja \
          -C out/android_${{ matrix.mode }}_arm64 \
          flutter.jar



    ##################################################
    #
    # Linux ARM64 host
    #
    ##################################################


    - name: Configure Linux ARM64 host


      run: |


        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os linux \
          --linux-cpu arm64 \
          --runtime-mode ${{ matrix.mode }} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts



    - name: Build Linux ARM64 gen_snapshot


      run: |


        cd flutter-engine/src


        ninja \
          -C out/linux_${{ matrix.mode }}_arm64 \
          gen_snapshot




    ##################################################
    #
    # Assemble Flutter artifact
    #
    ##################################################


    - name: Assemble artifact


      run: |


        cd flutter-engine/src


        mkdir -p artifact/android-arm64-${{ matrix.mode }}/linux-x64



        echo "Copy flutter.jar"


        cp \
        $(find out/android_${{ matrix.mode }}_arm64 \
          -name flutter.jar \
          | head -1) \
        artifact/android-arm64-${{ matrix.mode }}/flutter.jar



        echo "Copy Linux ARM64 gen_snapshot"


        cp \
        $(find out/linux_${{ matrix.mode }}_arm64 \
          -name gen_snapshot \
          | head -1) \
        artifact/android-arm64-${{ matrix.mode }}/linux-x64/gen_snapshot



        echo "Artifact tree"

        tree artifact




    - name: Verify gen_snapshot


      run: |


        file \
        flutter-engine/src/artifact/android-arm64-${{ matrix.mode }}/linux-x64/gen_snapshot




    - name: Package


      run: |


        cd flutter-engine/src/artifact


        zip -r \
          flutter-engine-android-arm64-${{ matrix.mode }}.zip \
          android-arm64-${{ matrix.mode }}



    - name: Upload


      uses: actions/upload-artifact@v4


      with:


        name:

          flutter-engine-android-arm64-${{ matrix.mode }}


        path:

          flutter-engine/src/artifact/flutter-engine-android-arm64-${{ matrix.mode }}.zip
