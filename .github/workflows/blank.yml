name: Flutter Engine Linux ARM64 Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write


jobs:

# =========================================================
# Build Engine Artifacts
# =========================================================

  build-engine:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - abi: arm
            target: android-arm

          - abi: arm64
            target: android-arm64

          - abi: x64
            target: android-x64


    steps:


    - name: Free disk
      uses: easimon/maximize-build-space@v4
      with:
        root-reserve-mb: 1024
        swap-size-mb: 4096
        remove-dotnet: true
        remove-haskell: true
        remove-android: true


    - name: Install deps
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          curl \
          unzip \
          zip \
          xz-utils \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu



    - name: Install depot_tools
      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git

        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Clone Flutter
      run: |

        git clone \
          --depth=1 \
          -b stable \
          https://github.com/flutter/flutter.git \
          flutter



    - name: Sync Engine
      run: |

        cd flutter

        ENGINE=$(cat bin/internal/engine.version)

        echo "Engine=$ENGINE"


        git clone \
          --depth=1 \
          https://github.com/flutter/engine.git \
          engine


        cd engine


        git fetch origin $ENGINE

        git checkout $ENGINE


        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git


        gclient sync \
          --no-history



    - name: Build Android Engine
      run: |

        cd flutter/engine/src


        for MODE in release # profile
        do

          echo "=============================="
          echo "MODE=$MODE"
          echo "=============================="


          OUT="out/${{matrix.target}}-$MODE"


          rm -rf $OUT



          ./flutter/tools/gn \
            --runtime-mode $MODE \
            --target-os android \
            --android-cpu ${{matrix.abi}} \
            --target-cpu arm64 \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts \
            --out-dir $OUT



          ninja \
            -C $OUT \
            flutter.jar \
            gen_snapshot \
            -j$(nproc)



          ART="artifact/${{matrix.target}}-$MODE"


          mkdir -p \
            $ART/linux-arm64



          cp \
            $OUT/flutter.jar \
            $ART/


          cp \
            $OUT/gen_snapshot \
            $ART/linux-arm64/



          chmod +x \
            $ART/linux-arm64/gen_snapshot



          echo "VERIFY"

          file \
            $ART/linux-arm64/gen_snapshot


        done



    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: engine-${{matrix.target}}

        path:

          flutter/engine/src/artifact/

        retention-days: 1



# =========================================================
# Assemble SDK
# =========================================================


  assemble:

    needs:
      - build-engine

    runs-on: ubuntu-latest


    steps:


    - name: Download artifacts
      uses: actions/download-artifact@v4

      with:

        path: engine-artifacts



    - name: Clone Flutter SDK
      run: |

        git clone \
          --depth=1 \
          -b stable \
          https://github.com/flutter/flutter.git \
          flutter-sdk



    - name: Inject Engine
      run: |

        ENGINE_DIR=

        flutter-sdk/bin/cache/artifacts/engine



        rm -rf $ENGINE_DIR

        mkdir -p $ENGINE_DIR



        find engine-artifacts \
          -type d \
          -mindepth 2 \
          -maxdepth 2 \
          -exec cp -a {} $ENGINE_DIR/ \;



        echo "ENGINE CACHE"

        tree $ENGINE_DIR



    - name: Install Dart ARM64 SDK
      run: |

        cd flutter-sdk


        ENGINE=$(cat bin/internal/engine.version)


        curl -L \
          https://storage.googleapis.com/flutter_infra_release/flutter/$ENGINE/dart-sdk-linux-arm64.zip \
          -o dart.zip



        rm -rf bin/cache/dart-sdk


        unzip -q \
          dart.zip \
          -d bin/cache



        rm dart.zip



    - name: Fix permissions
      run: |

        chmod +x \
          flutter-sdk/bin/flutter



        chmod +x \
          flutter-sdk/bin/cache/dart-sdk/bin/*



        find \
          flutter-sdk/bin/cache/artifacts/engine \
          -name gen_snapshot \
          -exec chmod +x {} \;



    - name: Verify
      run: |


        find \
          flutter-sdk/bin/cache/artifacts/engine \
          -name gen_snapshot \
          -exec file {} \;



        file \
          flutter-sdk/bin/cache/dart-sdk/bin/dart



    - name: Package
      run: |

        tar -cJf \
          flutter-linux-arm64.tar.xz \
          flutter-sdk



    - name: Release
      env:

        GH_TOKEN:
          ${{secrets.GITHUB_TOKEN}}

      run: |


        DATE=$(date -u +"%Y-%m-%d")

        TAG="${DATE}-daily-build"



        gh release delete \
          $TAG \
          --yes \
          --cleanup-tag || true



        gh release create \
          $TAG \
          flutter-linux-arm64.tar.xz \
          --title \
          "Flutter Linux ARM64 SDK $DATE" \
          --notes \
          "Self built Flutter SDK Linux ARM64 host." \
          --latest
