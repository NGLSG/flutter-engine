name: Flutter Engine Daily Build

on:
  workflow_dispatch:

  schedule:
    - cron: "00 16 * * *"


permissions:
  contents: write


jobs:

  build-engine:

    name: Build Android ${{ matrix.arch }} Release

    strategy:
      fail-fast: false

      matrix:
        include:

          - arch: x64
            android_cpu: x64
            artifact_dir: android-x64-release

          - arch: arm64
            android_cpu: arm64
            artifact_dir: android-arm64-release

          - arch: arm
            android_cpu: arm
            artifact_dir: android-arm-release


    runs-on: ubuntu-latest


    steps:


      - name: Maximize build space

        uses: easimon/maximize-build-space@v4

        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: true
          remove-haskell: true
          remove-android: true


      - name: Install dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            ninja-build \
            clang \
            python3 \
            python-is-python3 \
            zip \
            unzip \
            tree \
            file


      - name: Install depot_tools

        run: |

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git

          echo "$PWD/depot_tools" >> "$GITHUB_PATH"


      - name: Fetch Flutter Engine

        run: |

          mkdir flutter-engine

          cd flutter-engine

          gclient config \
            --name src/flutter \
            https://github.com/flutter/engine.git

          gclient sync \
            --no-history \
            --shallow


      #
      # Android target
      #
      # This produces the Android flutter.jar
      #

      - name: Configure Android ${{ matrix.arch }}

        run: |

          cd flutter-engine/src

          ./flutter/tools/gn \
            --target-os android \
            --android-cpu ${{ matrix.android_cpu }} \
            --runtime-mode release \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts


      - name: Build Android flutter.jar

        run: |

          cd flutter-engine/src

          ANDROID_OUT="out/android_release_${{ matrix.arch }}"

          echo "Android output:"
          echo "$ANDROID_OUT"

          test -f "$ANDROID_OUT/build.ninja"

          ninja \
            -C "$ANDROID_OUT" \
            flutter.jar


      #
      # Linux ARM64 host
      #
      # gen_snapshot MUST be Linux ARM64.
      #
      # It is NOT built from the Android GN configuration.
      #

      - name: Configure Linux ARM64 host

        run: |

          cd flutter-engine/src

          ./flutter/tools/gn \
            --target-os linux \
            --linux-cpu arm64 \
            --runtime-mode release \
            --no-goma \
            --no-enable-unittests \
            --build-engine-artifacts


      - name: Build Linux ARM64 gen_snapshot

        run: |

          cd flutter-engine/src

          LINUX_OUT="out/linux_release_arm64"

          echo "Linux ARM64 host output:"
          echo "$LINUX_OUT"

          test -f "$LINUX_OUT/build.ninja"

          ninja \
            -C "$LINUX_OUT" \
            gen_snapshot


      #
      # Assemble the exact Flutter artifact layout.
      #
      # IMPORTANT:
      #
      # Flutter expects:
      #
      # android-xxx-release/
      # └── linux-arm64/
      #     └── gen_snapshot
      #

      - name: Assemble artifact

        run: |

          cd flutter-engine/src

          ANDROID_OUT="out/android_release_${{ matrix.arch }}"
          LINUX_OUT="out/linux_release_arm64"

          EXPORT_ROOT="artifact"

          ARTIFACT="${EXPORT_ROOT}/${{ matrix.artifact_dir }}"

          rm -rf "$EXPORT_ROOT"

          mkdir -p \
            "$ARTIFACT/linux-arm64"


          echo "Copy flutter.jar"

          FLUTTER_JAR="$ANDROID_OUT/flutter.jar"

          test -f "$FLUTTER_JAR"

          cp \
            "$FLUTTER_JAR" \
            "$ARTIFACT/flutter.jar"


          echo "Copy Linux ARM64 gen_snapshot"

          GEN_SNAPSHOT="$LINUX_OUT/gen_snapshot"

          test -f "$GEN_SNAPSHOT"

          cp \
            "$GEN_SNAPSHOT" \
            "$ARTIFACT/linux-arm64/gen_snapshot"


          echo ""
          echo "Artifact tree:"
          tree "$EXPORT_ROOT"


      #
      # Verify that gen_snapshot is REALLY Linux ARM64.
      #

      - name: Verify gen_snapshot architecture

        run: |

          cd flutter-engine/src

          GEN_SNAPSHOT="artifact/${{ matrix.artifact_dir }}/linux-arm64/gen_snapshot"

          echo "Checking:"
          echo "$GEN_SNAPSHOT"

          file "$GEN_SNAPSHOT"

          readelf -l "$GEN_SNAPSHOT" | grep "Requesting program interpreter"

          echo ""
          echo "Expected:"
          echo "Linux ARM64"
          echo "NOT Android /system/bin/linker64"


          if file "$GEN_SNAPSHOT" | grep -q "/system/bin/linker64"; then
            echo "ERROR: gen_snapshot is an Android executable."
            exit 1
          fi


          if ! file "$GEN_SNAPSHOT" | grep -q "ARM aarch64"; then
            echo "ERROR: gen_snapshot is not ARM64."
            exit 1
          fi


          if ! file "$GEN_SNAPSHOT" | grep -q "GNU/Linux"; then
            echo "ERROR: gen_snapshot is not a Linux executable."
            exit 1
          fi


      #
      # Verify flutter.jar
      #

      - name: Verify flutter.jar

        run: |

          cd flutter-engine/src

          JAR="artifact/${{ matrix.artifact_dir }}/flutter.jar"

          test -f "$JAR"

          echo "flutter.jar:"
          ls -lh "$JAR"


      #
      # Package only this architecture.
      #

      - name: Package

        run: |

          cd flutter-engine/src/artifact

          ZIP="flutter-engine-${{ matrix.arch }}-release.zip"

          zip -r \
            "$ZIP" \
            "${{ matrix.artifact_dir }}"


          echo ""
          echo "Package:"
          ls -lh "$ZIP"


      #
      # Upload the ZIP as an Actions artifact.
      #
      # The release job downloads these exact files.
      #

      - name: Upload build artifact

        uses: actions/upload-artifact@v4

        with:

          name: flutter-engine-${{ matrix.arch }}-release

          path: |
            flutter-engine/src/artifact/flutter-engine-${{ matrix.arch }}-release.zip

          if-no-files-found: error

          retention-days: 7



  #
  # Create GitHub Release after ALL three builds finish.
  #

  release:

    name: Create Daily Release

    needs:
      - build-engine

    runs-on: ubuntu-latest


    steps:


      - name: Download release artifacts

        uses: actions/download-artifact@v4

        with:
          pattern: flutter-engine-*-release
          path: release-assets
          merge-multiple: true


      - name: Show release files

        run: |

          echo "Release files:"

          find release-assets \
            -type f \
            -maxdepth 2 \
            -print \
            -exec ls -lh {} \;


      - name: Generate release date

        id: date

        run: |

          DATE="$(date -u +'%Y-%m-%d')"

          TAG="${DATE}-daily-build"

          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      - name: Verify all three packages

        run: |

          test -f \
            release-assets/flutter-engine-x64-release.zip

          test -f \
            release-assets/flutter-engine-arm64-release.zip

          test -f \
            release-assets/flutter-engine-arm-release.zip


          echo "All release packages exist."


      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.date.outputs.tag }}

          name: ${{ steps.date.outputs.tag }}

          body: |
            Flutter Engine daily build

            Date: ${{ steps.date.outputs.date }}

            Android release targets:

            - Android x64
            - Android ARM64
            - Android ARM

            Host:

            - Linux ARM64

            Each package contains the corresponding Flutter Android
            `flutter.jar` and the Linux ARM64 `gen_snapshot`
            under Flutter's expected artifact directory layout.

          files: |
            release-assets/flutter-engine-x64-release.zip
            release-assets/flutter-engine-arm64-release.zip
            release-assets/flutter-engine-arm-release.zip

          fail_on_unmatched_files: true

          make_latest: true
