name: Flutter Engine gen_snapshot Android ARM64

on:
  workflow_dispatch:


jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
          - profile


    runs-on: ubuntu-latest


    steps:


    - name: Maximize build space

      uses: easimon/maximize-build-space@v4

      with:
        root-reserve-mb: 512
        swap-size-mb: 4096
        remove-dotnet: true
        remove-haskell: true
        remove-android: true



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu



    - name: Install depot_tools

      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git


        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Fetch Flutter engine

      run: |

        mkdir flutter-engine

        cd flutter-engine


        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git


        gclient sync \
          --no-history \
          --shallow



    - name: Configure GN

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --linux-cpu arm64 \
          --runtime-mode ${{ matrix.mode }} \
          --no-goma \
          --no-enable-unittests \
          --build-engine-artifacts



    - name: Show output

      run: |

        cd flutter-engine/src

        find out -maxdepth 3 -name build.ninja



    - name: Build gen_snapshot only

      run: |

        cd flutter-engine/src


        OUT_DIR=$(dirname $(find out \
          -name build.ninja \
          | head -1))


        echo "Building: ${OUT_DIR}"


        ninja \
          -C "${OUT_DIR}" \
          gen_snapshot



    - name: Locate artifact

      run: |

        cd flutter-engine/src


        find out \
          -type f \
          -name gen_snapshot \
          -exec file {} \;



    - name: Package

      run: |

        mkdir artifact


        cp \
        $(find flutter-engine/src/out \
          -type f \
          -name gen_snapshot \
          | head -1) \
        artifact/gen_snapshot


        cd artifact


        zip \
          ../gen_snapshot_android_arm64_linux_arm64_${{ matrix.mode }}.zip \
          gen_snapshot



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name:
          gen_snapshot-android-arm64-linux-arm64-${{ matrix.mode }}

        path:
          gen_snapshot_android_arm64_linux_arm64_${{ matrix.mode }}.zip
