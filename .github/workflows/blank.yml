name: Flutter Engine gen_snapshot ARM64

on:
  workflow_dispatch:

jobs:

  build-gen-snapshot:

    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
          - profile


    runs-on: ubuntu-latest


    steps:


    - name: Maximize build space

      uses: easimon/maximize-build-space@v4

      with:
        root-reserve-mb: 256
        swap-size-mb: 4096
        remove-dotnet: true
        remove-haskell: true
        remove-android: true



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          git \
          ninja-build \
          clang \
          python3 \
          python-is-python3 \
          zip \
          unzip \
          g++-aarch64-linux-gnu \
          gcc-aarch64-linux-gnu



    - name: Install depot_tools

      run: |

        git clone --depth=1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git


        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Fetch Flutter Engine

      run: |

        mkdir flutter-engine

        cd flutter-engine


        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git


        gclient sync \
          --no-history \
          --shallow



    - name: Configure GN

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --linux-cpu arm64 \
          --runtime-mode ${{ matrix.mode }} \
          --no-goma \
          --no-enable-unittests \
          --no-build-canvaskit \
          --no-full-dart-sdk \
          --build-engine-artifacts



    - name: Build only gen_snapshot

      run: |

        cd flutter-engine/src


        echo "Find output directory"


        OUT_DIR=$(find out \
          -maxdepth 1 \
          -type d \
          -name "android_*" \
          | head -1)


        echo "OUT_DIR=$OUT_DIR"


        ninja \
          -C "$OUT_DIR" \
          gen_snapshot



    - name: Locate gen_snapshot

      run: |

        cd flutter-engine/src


        find out \
          -name gen_snapshot \
          -type f \
          -exec ls -lh {} \;



    - name: Package artifact

      run: |

        mkdir artifact


        cp $(find flutter-engine/src/out \
          -name gen_snapshot \
          -type f \
          | head -1) \
          artifact/gen_snapshot


        cd artifact


        zip \
          ../gen_snapshot_android-arm64_linux-arm64_${{ matrix.mode }}.zip \
          gen_snapshot



    - name: Upload artifact

      uses: actions/upload-artifact@v4

      with:

        name:
          gen_snapshot-android-arm64-linux-arm64-${{ matrix.mode }}

        path:
          gen_snapshot_android-arm64_linux-arm64_${{ matrix.mode }}.zip
