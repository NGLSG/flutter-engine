name: Flutter Engine Daily Build

on:
  workflow_dispatch:
  schedule:
    - cron: "00 16 * * *"

permissions:
  contents: write

jobs:
  # =========================================================
  # Job 1: 多 Matrix 并行编译，完全自编译出所有 Engine 碎片
  # =========================================================
  build-engine:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm
            os: android
            cpu: arm
            out_dir: android
          - target: android-arm64
            os: android
            cpu: arm64
            out_dir: android
          - target: android-x64
            os: android
            cpu: x64
            out_dir: android
          - target: linux-arm64
            os: linux
            cpu: arm64
            out_dir: linux
          - target: linux-x64
            os: linux
            cpu: x64
            out_dir: linux

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v4
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: true
          remove-haskell: true
          remove-android: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ninja-build clang python3 python-is-python3 \
            zip unzip tree file xz-utils curl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch Flutter Engine
        run: |
          mkdir flutter-engine
          cd flutter-engine
          gclient config --name src/flutter https://github.com/flutter/engine.git
          gclient sync --no-history

      - name: Build Engine Artifacts
        run: |
          cd flutter-engine/src
          EXPORT_DIR="export-${{ matrix.target }}"

          build_mode() {
            MODE=$1
            echo "=========================================="
            echo "Building ${{ matrix.target }} - $MODE"
            echo "=========================================="

            ART_DIR="$EXPORT_DIR/${{ matrix.target }}-${MODE}"
            mkdir -p "$ART_DIR/linux-arm64"

            # ---------------------------------------------------
            # Step A: 如果是 Android，先编 Android 端的 flutter.jar
            # ---------------------------------------------------
            if [ "${{ matrix.os }}" = "android" ]; then
              rm -rf out
              ./flutter/tools/gn \
                --target-os android \
                --android-cpu ${{ matrix.cpu }} \
                --runtime-mode $MODE \
                --no-goma \
                --no-enable-unittests \
                --build-engine-artifacts

              OUT_ANDROID=$(find out -name build.ninja -printf '%h\n' | tail -1)
              ninja -C "$OUT_ANDROID" flutter.jar -j20

              cp "$OUT_ANDROID/flutter.jar" "$ART_DIR/flutter.jar"
            fi

            # ---------------------------------------------------
            # Step B: 独立配置 Linux ARM64 Host，编译真正的 Linux ARM64 gen_snapshot
            # ---------------------------------------------------
            rm -rf out
            ./flutter/tools/gn \
              --target-os linux \
              --linux-cpu arm64 \
              --runtime-mode $MODE \
              --no-goma \
              --no-enable-unittests \
              --build-engine-artifacts

            OUT_LINUX=$(find out -name build.ninja -printf '%h\n' | tail -1)
            ninja -C "$OUT_LINUX" gen_snapshot -j20

            cp "$OUT_LINUX/gen_snapshot" "$ART_DIR/linux-arm64/gen_snapshot"
          }

          build_mode release

      - name: Verify Architecture Integrity
        run: |
          cd flutter-engine/src/export-${{ matrix.target }}
          echo "Verifying generated gen_snapshot binaries:"
          find . -name gen_snapshot -exec file {} \;

          for snap in $(find . -name gen_snapshot); do
            file "$snap" | grep "ARM aarch64" || (echo "ERROR: $snap is not ARM64!" && exit 1)
            file "$snap" | grep "GNU/Linux" || (echo "ERROR: $snap is not a Linux executable!" && exit 1)
          done

      - name: Upload Single Target Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifact-${{ matrix.target }}
          path: flutter-engine/src/export-${{ matrix.target }}/
          retention-days: 1

# =========================================================
  # Job 2: 组装 Ready-to-use SDK、先传 Artifact 缓冲，再发布 Release
  # =========================================================
  assemble-and-package:
    name: Assemble SDK & Create Release
    needs: build-engine
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tree file xz-utils curl unzip

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: fetched-artifacts

      - name: Clone Clean Flutter SDK
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git flutter-sdk

      - name: Assemble All Built Artifacts
        run: |
          ENGINE_CACHE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          rm -rf "$ENGINE_CACHE_DIR"
          mkdir -p "$ENGINE_CACHE_DIR"

          # 1. 组装自编译的 Engine 碎片
          find fetched-artifacts -mindepth 2 -maxdepth 2 -type d | while read dir; do
            dirname=$(basename "$dir")
            echo "Injecting engine artifact: $dirname"
            cp -a "$dir" "$ENGINE_CACHE_DIR/"
          done

          ENGINE_COMMIT=$(cat flutter-sdk/bin/internal/engine.version)

          # 2. 补全 Linux ARM64 宿主原生的 Dart SDK
          DART_SDK_URL="https://storage.googleapis.com/flutter_infra_release/flutter/${ENGINE_COMMIT}/dart-sdk-linux-arm64.zip"
          echo "Fetching Native Linux ARM64 Dart SDK from: $DART_SDK_URL"

          curl -sSL "$DART_SDK_URL" -o dart-sdk-arm64.zip
          rm -rf flutter-sdk/bin/cache/dart-sdk
          unzip -q dart-sdk-arm64.zip -d flutter-sdk/bin/cache/
          rm dart-sdk-arm64.zip

          # 3. 写入 engine.stamp 锁定标记
          echo "$ENGINE_COMMIT" > flutter-sdk/bin/cache/engine.stamp

      - name: Compress SDK Package
        run: |
          tar -cJf flutter-linux-arm64.tar.xz flutter-sdk
          ls -lh flutter-linux-arm64.tar.xz

      # ---------------------------------------------------------
      # 缓冲步骤：先将最终打好的包上传到 Actions Artifacts 保存
      # 即使后面的 Release 发布步骤失败，产物依然可以在 Workflow 运行界面下载
      # ---------------------------------------------------------
      - name: Buffer Final Package to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-arm64-full-sdk
          path: flutter-linux-arm64.tar.xz
          retention-days: 7

      - name: Generate Release Tag
        id: date
        run: |
          DATE="$(date -u +'%Y-%m-%d')"
          TAG="${DATE}-daily-build"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 发布步骤：使用官方 gh CLI 读取并上传已打包好的文件
      # ---------------------------------------------------------
      - name: Create GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.date.outputs.tag }}"
          DATE="${{ steps.date.outputs.date }}"

          echo "Deleting old release/tag if exists..."
          gh release delete "$TAG" --yes --cleanup-tag || true

          echo "Creating new release $TAG..."
          gh release create "$TAG" \
            flutter-linux-arm64.tar.xz \
            --title "Flutter SDK (Linux ARM64 Out-of-the-Box) - $DATE" \
            --notes "Out-of-the-box ready-to-use Flutter SDK for Linux ARM64 host devices." \
            --latest
