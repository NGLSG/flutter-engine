name: Flutter Engine Daily Build

on:
  workflow_dispatch:
  schedule:
    - cron: "00 16 * * *"

permissions:
  contents: write

jobs:
  # =========================================================
  # Job 1: 矩阵构建，按 Flutter Stable 精确 Commit 编译 Engine
  # =========================================================
  build-engine:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm
            os: android
            cpu: arm
          - target: android-arm64
            os: android
            cpu: arm64
          - target: android-x64
            os: android
            cpu: x64
          - target: linux-arm64
            os: linux
            cpu: arm64
          - target: linux-x64
            os: linux
            cpu: x64

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v4
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: true
          remove-haskell: true
          remove-android: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ninja-build clang python3 python-is-python3 \
            zip unzip tree file xz-utils curl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      # 获取 Flutter Stable 分支对应的 Engine Commit，并绕过 upload-pack 限制
      - name: Fetch Matching Engine Version
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git temp-flutter
          ENGINE_COMMIT=$(cat temp-flutter/bin/internal/engine.version)
          echo "Matching Engine Commit: $ENGINE_COMMIT"
          rm -rf temp-flutter

          mkdir flutter-engine
          cd flutter-engine

          # 1. 不在 gclient 层面绑定 commit SHA，避开 upload-pack 报错
          gclient config --name src/flutter https://github.com/flutter/engine.git

          # 2. 仅同步引擎 Git 仓库主干
          gclient sync --no-history --nohooks

          # 3. 进目录抓取全量 Ref 并切换到指定 Commit
          cd src/flutter
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          git checkout $ENGINE_COMMIT
          cd ../..

          # 4. 再次运行 gclient 补全当前 Commit 的第三方依赖与 Hooks
          gclient sync

      - name: Build Engine Artifacts
        run: |
          cd flutter-engine/src
          EXPORT_DIR="export-${{ matrix.target }}"

          build_mode() {
            MODE=$1
            echo "=========================================="
            echo "Building ${{ matrix.target }} - $MODE"
            echo "=========================================="

            ART_DIR="$EXPORT_DIR/${{ matrix.target }}-${MODE}"
            mkdir -p "$ART_DIR/linux-arm64"

            # 1. 如果是 Android 目标，编译 Android 运行库 flutter.jar
            if [ "${{ matrix.os }}" = "android" ]; then
              rm -rf out
              ./flutter/tools/gn \
                --target-os android \
                --android-cpu ${{ matrix.cpu }} \
                --runtime-mode $MODE \
                --no-goma \
                --no-enable-unittests \
                --build-engine-artifacts

              OUT_ANDROID=$(find out -name build.ninja -printf '%h\n' | tail -1)
              ninja -C "$OUT_ANDROID" flutter.jar -j20

              cp "$OUT_ANDROID/flutter.jar" "$ART_DIR/flutter.jar"
            fi

            # 2. 独立配置 Linux ARM64，编译原生 Linux ARM64 ELF 格式的 gen_snapshot
            rm -rf out
            ./flutter/tools/gn \
              --target-os linux \
              --linux-cpu arm64 \
              --runtime-mode $MODE \
              --no-goma \
              --no-enable-unittests \
              --build-engine-artifacts

            OUT_LINUX=$(find out -name build.ninja -printf '%h\n' | tail -1)
            ninja -C "$OUT_LINUX" gen_snapshot -j20

            cp "$OUT_LINUX/gen_snapshot" "$ART_DIR/linux-arm64/gen_snapshot"
            chmod +x "$ART_DIR/linux-arm64/gen_snapshot"
          }

          build_mode profile
          build_mode release

      - name: Upload Single Target Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifact-${{ matrix.target }}
          path: flutter-engine/src/export-${{ matrix.target }}/
          retention-days: 1

  # =========================================================
  # Job 2: 组装 SDK，赋予执行权限，缓冲并发布
  # =========================================================
  assemble-and-package:
    name: Assemble SDK & Create Release
    needs: build-engine
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tree file xz-utils curl unzip

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: fetched-artifacts

      - name: Clone Clean Flutter SDK
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git flutter-sdk

      - name: Assemble All Built Artifacts & Fix Permissions
        run: |
          ENGINE_CACHE_DIR="flutter-sdk/bin/cache/artifacts/engine"
          rm -rf "$ENGINE_CACHE_DIR"
          mkdir -p "$ENGINE_CACHE_DIR"

          # 1. 组装自编译 Engine 碎片
          find fetched-artifacts -mindepth 2 -maxdepth 2 -type d | while read dir; do
            dirname=$(basename "$dir")
            echo "Injecting engine artifact: $dirname"
            cp -a "$dir" "$ENGINE_CACHE_DIR/"
          done

          ENGINE_COMMIT=$(cat flutter-sdk/bin/internal/engine.version)

          # 2. 拉取原生 Linux ARM64 Dart SDK
          DART_SDK_URL="https://storage.googleapis.com/flutter_infra_release/flutter/${ENGINE_COMMIT}/dart-sdk-linux-arm64.zip"
          echo "Fetching Native Linux ARM64 Dart SDK from: $DART_SDK_URL"

          curl -sSL "$DART_SDK_URL" -o dart-sdk-arm64.zip
          rm -rf flutter-sdk/bin/cache/dart-sdk
          unzip -q dart-sdk-arm64.zip -d flutter-sdk/bin/cache/
          rm dart-sdk-arm64.zip

          # 3. 写入 engine.stamp 锁定标记
          echo "$ENGINE_COMMIT" > flutter-sdk/bin/cache/engine.stamp

          # 4. 统一递归赋予可执行权限 (+x)
          echo "Granting execution permissions (+x) to all host binaries..."
          chmod +x flutter-sdk/bin/flutter
          chmod +x flutter-sdk/bin/cache/dart-sdk/bin/*
          find flutter-sdk/bin/cache/artifacts/engine -name gen_snapshot -exec chmod +x {} \;

      - name: Verify Architecture & Executable Permissions
        run: |
          DART_BIN="flutter-sdk/bin/cache/dart-sdk/bin/dart"
          GEN_SNAPSHOT="flutter-sdk/bin/cache/artifacts/engine/android-arm64-release/linux-arm64/gen_snapshot"

          echo "Permissions verification:"
          ls -l "$DART_BIN"
          ls -l "$GEN_SNAPSHOT"

          file "$DART_BIN" | grep "ARM aarch64" || (echo "ERROR: Dart Binary is NOT Linux ARM64!" && exit 1)
          file "$GEN_SNAPSHOT" | grep "ARM aarch64" || (echo "ERROR: gen_snapshot is NOT Linux ARM64!" && exit 1)

      - name: Compress SDK Package
        run: |
          tar -cJf flutter-linux-arm64.tar.xz flutter-sdk
          ls -lh flutter-linux-arm64.tar.xz

      - name: Buffer Final Package to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-arm64-full-sdk
          path: flutter-linux-arm64.tar.xz
          retention-days: 7

      - name: Generate Release Tag
        id: date
        run: |
          DATE="$(date -u +'%Y-%m-%d')"
          TAG="${DATE}-daily-build"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.date.outputs.tag }}"
          DATE="${{ steps.date.outputs.date }}"

          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" \
            flutter-linux-arm64.tar.xz \
            --title "Flutter SDK (Linux ARM64 Out-of-the-Box) - $DATE" \
            --notes "Out-of-the-box ready-to-use Flutter SDK for Linux ARM64 host devices." \
            --latest
