name: Flutter Engine ARM64 Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-engine-arm64-android:

    runs-on: ubuntu-latest

    steps:

    - name: Maximize build space
      uses: easimon/maximize-build-space@v4
      with:
        root-reserve-mb: 512
        swap-size-mb: 2048
        remove-dotnet: true
        remove-haskell: true
        remove-android: true


    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          curl \
          unzip \
          zip \
          ninja-build \
          clang \
          cmake \
          pkg-config \
          python3 \
          python-is-python3 \
          g++-aarch64-linux-gnu \
          gcc-aarch64-linux-gnu


    - name: Install depot_tools
      run: |

        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

        echo "$PWD/depot_tools" >> $GITHUB_PATH



    - name: Fetch Flutter Engine

      run: |

        mkdir flutter-engine

        cd flutter-engine

        gclient config \
          --name src/flutter \
          https://github.com/flutter/engine.git

        gclient sync



    - name: Build Android ARM64 Release

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --runtime-mode release \
          --no-goma


        ninja \
          -C out/android_release_arm64



    - name: Build Android ARM64 Profile

      run: |

        cd flutter-engine/src


        ./flutter/tools/gn \
          --target-os android \
          --android-cpu arm64 \
          --runtime-mode profile \
          --no-goma


        ninja \
          -C out/android_profile_arm64



    - name: Package

      run: |

        cd flutter-engine/src/out


        zip -q -r android_release_arm64.zip \
          android_release_arm64


        zip -q -r android_profile_arm64.zip \
          android_profile_arm64



    - name: Get date

      id: date

      run: |

        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT



    - name: Release

      uses: ncipollo/release-action@v1

      with:

        artifacts: |
          flutter-engine/src/out/android_release_arm64.zip
          flutter-engine/src/out/android_profile_arm64.zip

        tag: Flutter-Engine-Android-ARM64-${{ steps.date.outputs.date }}

        token: ${{ secrets.RELEASE_TOKEN }}

        allowUpdates: true
