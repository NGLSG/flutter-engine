name: Daily Engine Build (Linux arm64)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  ENGINE_SRC: ${{ github.workspace }}/flutter-engine/src

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix:
        mode: [release, profile]

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v4
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabihf \
            g++-multilib \
            gcc-multilib \
            zip

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}/depot_tools" >> $GITHUB_PATH

      - name: Create .gclient
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p flutter-engine
          cat > flutter-engine/.gclient << 'EOF'
          solutions = [
            {
              "managed": False,
              "name": "src/flutter",
              "url": "https://github.com/flutter/engine.git",
              "custom_deps": {},
              "deps_file": "DEPS",
              "safesync_url": "",
            },
          ]
          EOF

      - name: Sync dependencies
        working-directory: ${{ github.workspace }}/flutter-engine
        run: |
          gclient sync --no-history -j$(nproc)
        timeout-minutes: 120

      - name: Build engine (${{ matrix.mode }})
        working-directory: ${{ env.ENGINE_SRC }}
        run: |
          ./flutter/tools/gn \
            --target-os android \
            --android-cpu arm64 \
            --linux-cpu arm64 \
            --no-goma \
            --runtime-mode ${{ matrix.mode }}

          ninja -C out/android_${{ matrix.mode }}_arm64 \
            gen_snapshot \
            flutter.jar \
            libflutter.so
        timeout-minutes: 180

      - name: Package artifacts (as linux-x64)
        run: |
          MODE=${{ matrix.mode }}
          OUT_DIR=${{ env.ENGINE_SRC }}/out/android_${MODE}_arm64

          PKG_DIR=${{ runner.temp }}/android-arm64-${MODE}/linux-x64
          mkdir -p ${PKG_DIR}

          cp ${OUT_DIR}/gen_snapshot  ${PKG_DIR}/
          cp ${OUT_DIR}/flutter.jar   ${PKG_DIR}/
          cp ${OUT_DIR}/libflutter.so ${PKG_DIR}/

          cd ${PKG_DIR}/../..
          tar -czf ${{ runner.temp }}/engine-android-arm64-${MODE}-linux-x64.tar.gz \
            android-arm64-${MODE}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-android-arm64-${{ matrix.mode }}-linux-x64
          path: ${{ runner.temp }}/engine-android-arm64-${{ matrix.mode }}-linux-x64.tar.gz
          retention-days: 30
